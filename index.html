<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SILLA V2</title>
<style>
  :root { color-scheme: dark; --bg:#000; --fg:#fff; --muted:#8a8a8a; --gap:clamp(12px,2vw,28px); --h:min(44vh,38vw); }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; background:var(--bg); color:var(--fg); font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; }
  .deck { height:100%; overflow-y:auto; scrollbar-width:none; }
  .deck::-webkit-scrollbar { display:none; }
  .slide { position:relative; height:100vh; height:100dvh; overflow:hidden; background:#000; }

  /* Slide 1 */
  .hero { display:flex; align-items:center; justify-content:center; padding:0 var(--gap); }
  .hero h1 {
    width:100%; max-width:100%;
    font-weight:800; font-size:clamp(2rem,10vw,8rem);
    line-height:.98; letter-spacing:.04em; text-align:center;
    overflow-wrap:normal;
  }
  /* NYC Transit / Vignelli-era wayfinding: a precise, solid arrow with 45-degree shoulders. */
  .scroll-cue {
    position:absolute; z-index:2; left:50%; bottom:calc(22px + env(safe-area-inset-bottom,0px));
    display:grid; place-items:center; width:56px; height:56px;
    padding:0; border:0; border-radius:0; background:transparent; color:#fff;
    cursor:pointer; transform:translateX(-50%); opacity:1;
    -webkit-tap-highlight-color:transparent;
  }
  .scroll-cue img { display:block; width:42px; height:42px; object-fit:contain; transition:transform .16s ease; }
  .scroll-cue:hover img { transform:translateY(2px); }
  .scroll-cue:active img { transform:translateY(4px); }
  .scroll-cue:focus-visible { outline:2px solid #fff; outline-offset:2px; }
  @media (prefers-reduced-motion: reduce) {
    .scroll-cue img { transition:none; }
  }

  /* Slide 2 */
  .video-slide { height:min(56.25vw,92vh); height:min(56.25vw,92dvh); }
  .video-slide video, .video-slide canvas {
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; object-position:center; pointer-events:none;
  }
  .shade { position:absolute; inset:0; background:rgba(0,0,0,.25); transition:opacity .5s ease; }
  .video-slide:hover .shade { opacity:0; }

  /* Slide 3 */
  .gallery { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(16px,3vh,32px); padding:0 var(--gap) 64px; }
  .pair { display:flex; gap:var(--gap); align-items:flex-start; justify-content:center; width:100%; }
  .card { flex:none; width:var(--h); transition:width .5s cubic-bezier(.2,.7,.2,1); }
  .card:hover { width:calc(var(--h) * 1.5); }
  .card .img { height:var(--h); background-size:cover; background-position:center; }
  .card:nth-child(1) .img { background-color:#2b2b2b; background-image:linear-gradient(135deg,#3a3a3a,#111); }
  .card:nth-child(2) .img { background-color:#444; background-image:linear-gradient(135deg,#1a1a1a,#555); }
  .card h2 { margin-top:14px; font-size:1rem; font-weight:700; color:#fff; }
  .card p { margin-top:4px; font-size:.85rem; line-height:1.4; color:var(--muted); }

  footer { position:absolute; left:0; right:0; bottom:0; padding:18px 20px calc(18px + env(safe-area-inset-bottom,0px)); text-align:center; font-size:.8rem; color:var(--muted); }

  @media (max-width:600px) {
    /* Keep the video portrait (9:16) and crop its sides instead of shrinking it. */
    .video-slide {
      width:min(100vw,56.25vh);
      width:min(100vw,56.25dvh);
      height:min(177.7778vw,100vh);
      height:min(177.7778vw,100dvh);
      margin-inline:auto;
    }

    /* Stack the gallery and let it grow vertically so nothing is clipped. */
    .gallery {
      height:auto; min-height:100vh; min-height:100dvh; overflow:visible;
      justify-content:flex-start;
      padding:clamp(28px,6vh,56px) var(--gap) 0;
      gap:clamp(20px,4vh,32px);
    }
    .pair { flex-direction:column; align-items:center; gap:clamp(24px,4vh,36px); }
    .card, .card:hover { width:min(100%,460px); }
    .card .img { width:100%; height:auto; aspect-ratio:1 / 1; }
    footer {
      position:static; width:100%;
      padding:18px 0 calc(18px + env(safe-area-inset-bottom,0px));
    }
  }
</style>
</head>
<body>
<main class="deck" id="deck">

  <section class="slide hero" id="heroSlide">
    <h1>SILLA V2</h1>
    <button class="scroll-cue" id="scrollCue" type="button" aria-label="Bajar a la diapositiva del vídeo" title="Bajar">
      <img src="media/arrow.png" alt="" aria-hidden="true">
    </button>
  </section>

  <section class="slide video-slide" id="videoSlide">
    <!-- Put your video file URL/path here. Without one, an animated placeholder plays. -->
    <video id="vid" muted loop playsinline preload="auto" disablepictureinpicture controlslist="nodownload noplaybackrate noremoteplayback"></video>
    <canvas id="fallback" hidden></canvas>
    <div class="shade"></div>
  </section>

  <section class="slide gallery" id="gallerySlide">
    <div class="pair" id="pair"></div>
    <footer id="footer"></footer>
  </section>

</main>

<script>
/* ===== CUSTOMIZE ===== */
const VIDEO_SRC  = "media/0001-0288.mp4";   // e.g. "video.mp4"
const FOOTER_TEXT = "© 2026 Nicolás Carvjal Quero / Paula Martín Nova. All rights reserved.";
const ITEMS = [
  { img:"media/seccion silla paula.png", title:"Sección",  desc:"Sección y explicación de la construcción." },
  { img:"media/silla paula v2.png", title:"Silla V2", desc:"Diseño final." }
];
/* ===================== */

document.getElementById('footer').textContent = FOOTER_TEXT;
const pair = document.getElementById('pair');
ITEMS.forEach(it => {
  const c = document.createElement('div'); c.className = 'card';
  const i = document.createElement('div'); i.className = 'img';
  if (it.img) i.style.backgroundImage = `url("${it.img}")`;
  const h = document.createElement('h2'); h.textContent = it.title;
  const p = document.createElement('p');  p.textContent = it.desc;
  c.append(i, h, p); pair.appendChild(c);
});

/* Always start at the top, even after a refresh */
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
const toTop = () => { document.getElementById('deck').scrollTop = 0; scrollTo(0, 0); };
toTop();
addEventListener('load', toTop);
addEventListener('pageshow', toTop);

const vid = document.getElementById('vid'), cv = document.getElementById('fallback');
const slide = document.getElementById('videoSlide');
let raf = 0, started = false;

function drawFallback(t){
  const w = cv.width = cv.clientWidth, h = cv.height = cv.clientHeight, g = cv.getContext('2d');
  const x = t/1000;
  const grad = g.createLinearGradient(0,0,w,h);
  grad.addColorStop(0,`hsl(${(x*20)%360},60%,35%)`); grad.addColorStop(1,`hsl(${(x*20+120)%360},70%,20%)`);
  g.fillStyle = grad; g.fillRect(0,0,w,h);
  for(let k=0;k<5;k++){
    g.beginPath(); g.fillStyle = `hsla(${(x*30+k*60)%360},80%,60%,.35)`;
    g.arc(w/2+Math.cos(x*.6+k*1.3)*w*.3, h/2+Math.sin(x*.8+k)*h*.3, Math.min(w,h)*(.12+k*.03), 0, 7); g.fill();
  }
  raf = requestAnimationFrame(drawFallback);
}
function startMedia(){
  if (VIDEO_SRC){
    if (!vid.src) vid.src = VIDEO_SRC;
    vid.play().catch(()=>{});
  } else if (!raf){
    cv.hidden = false; raf = requestAnimationFrame(drawFallback);
  }
}
function stopMedia(){
  if (VIDEO_SRC){ vid.pause(); vid.currentTime = 0; }
  else { cancelAnimationFrame(raf); raf = 0; cv.hidden = true; }
}
if (!VIDEO_SRC) vid.hidden = true;

/* Soft snapping: the video settles at viewport center; other slides use their top edge. */
const deck = document.getElementById('deck');
const SNAP_DELAY = 180;
const SNAP_DISTANCE = 100;
let snapTimer = 0;

function getSnapPositions(){
  const viewport = deck.getBoundingClientRect();
  const current = deck.scrollTop;
  const maxScroll = deck.scrollHeight - deck.clientHeight;

  return [...deck.querySelectorAll('.slide')]
    .map(s => {
      const rect = s.getBoundingClientRect();
      const slideTop = rect.top - viewport.top + current;
      // Center the video vertically so the empty space is balanced above and below.
      const target = s.id === 'videoSlide'
        ? slideTop + rect.height / 2 - deck.clientHeight / 2
        : slideTop;
      return Math.max(0, Math.min(maxScroll, target));
    })
    .sort((a, b) => a - b);
}

function settleNearSlideEdge(){
  const positions = getSnapPositions();
  const current = deck.scrollTop;
  let closestIndex = -1;
  let closestDistance = Infinity;

  positions.forEach((position, i) => {
    const distance = Math.abs(position - current);
    if (distance < closestDistance){
      closestIndex = i;
      closestDistance = distance;
    }
  });

  if (closestIndex === -1) return;

  const leftGap = closestIndex > 0
    ? positions[closestIndex] - positions[closestIndex - 1]
    : Infinity;
  const rightGap = closestIndex < positions.length - 1
    ? positions[closestIndex + 1] - positions[closestIndex]
    : Infinity;
  const snapDistance = Math.min(SNAP_DISTANCE, Math.min(leftGap, rightGap) * .15);

  // Only settle when already close to a target; halfway positions remain untouched.
  if (closestDistance <= snapDistance){
    deck.scrollTo({ top:positions[closestIndex], behavior:'smooth' });
  }
}

deck.addEventListener('scroll', () => {
  clearTimeout(snapTimer);
  snapTimer = setTimeout(settleNearSlideEdge, SNAP_DELAY);
}, { passive:true });

/* The first-slide arrow scrolls to the same centered video position used by soft snapping. */
document.getElementById('scrollCue').addEventListener('click', () => {
  const videoPosition = getSnapPositions()[1];
  if (Number.isFinite(videoPosition)) deck.scrollTo({ top:videoPosition, behavior:'smooth' });
});

/* Start video once at least 90% of slide 2 is visible. */
new IntersectionObserver(es => {
  es.forEach(e => { if (e.isIntersecting && e.intersectionRatio >= .9 && !started) startMedia(); });
}, { root:deck, threshold:[0,.9,1] }).observe(slide);

/* The video can't be stopped by the viewer */
vid.addEventListener('pause', () => { if (!vid.ended && started) vid.play().catch(()=>{}); });
vid.addEventListener('play', () => started = true);
vid.addEventListener('ended', () => { vid.currentTime = 0; vid.play(); });
slide.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
